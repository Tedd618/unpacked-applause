[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "unpacked-applause"
version = "0.1.0"
description = "Does audience applause at tech keynotes move stock prices? An alternative-data event study."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  # data & statistics
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.12",
  "statsmodels>=0.14",
  "scikit-learn>=1.4",
  "pyarrow>=15",
  "duckdb>=1.0",
  # market data
  "yfinance>=0.2.50",
  "exchange-calendars>=4.5",
  "requests>=2.31",
  # audio & deep learning
  "yt-dlp[default]",
  "torch>=2.3",
  "torchlibrosa>=0.1.0",
  "librosa>=0.10",
  "soundfile>=0.12",
  # visualisation & reporting
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "jinja2>=3.1",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "jupyter", "nbconvert", "nbclient", "ipykernel"]

[project.scripts]
applause = "unpacked_applause.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
